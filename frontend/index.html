<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmoVoice • AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); }
        
        .record-btn { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .recording { animation: pulse-ring 2s infinite; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 30px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .wave { animation: soundwave 1.2s infinite ease-in-out; }
        @keyframes soundwave {
            0%, 100% { height: 6px; }
            50% { height: 28px; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-zinc-950 to-zinc-900 text-white min-h-screen">
    <div class="max-w-2xl mx-auto px-6 py-12">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold tracking-tight mb-3">EmoVoice <span class="text-violet-400">AI</span></h1>
            <p class="text-zinc-400 text-lg">Multimodal Speech Emotion Recognition</p>
        </div>

        <!-- Live Recording -->
        <div class="glass border border-white/10 rounded-3xl p-10 shadow-2xl mb-8">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-semibold flex items-center gap-3">
                    <i class="fa-solid fa-microphone"></i> Live Recording
                </h2>
                <div id="status" class="text-xs uppercase tracking-widest px-4 py-2 rounded-full bg-white/5 text-emerald-400 font-medium">
                    Ready
                </div>
            </div>

            <button id="recordBtn" 
                class="record-btn w-full h-32 bg-red-600 hover:bg-red-700 rounded-2xl text-2xl font-semibold flex items-center justify-center gap-4 focus:outline-none">
                <i class="fa-solid fa-microphone text-3xl"></i>
                <span id="recordText">HOLD TO RECORD</span>
            </button>

            <div id="liveIndicator" class="hidden flex justify-center gap-1 mt-6">
                <div class="wave w-2 bg-red-500 rounded-full"></div>
                <div class="wave w-2 bg-red-500 rounded-full" style="animation-delay: 150ms"></div>
                <div class="wave w-2 bg-red-500 rounded-full" style="animation-delay: 300ms"></div>
            </div>
        </div>

        <!-- Upload -->
        <div class="glass border border-white/10 rounded-3xl p-8 mb-8">
            <h2 class="text-xl font-semibold mb-6 flex items-center gap-3">
                <i class="fa-solid fa-upload"></i> Upload Audio File
            </h2>
            <div class="flex gap-4">
                <label class="flex-1 cursor-pointer border-2 border-dashed border-white/20 hover:border-violet-400 rounded-2xl p-8 text-center transition-all">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl mb-4 text-zinc-400"></i>
                    <p id="fileLabel" class="font-medium">Choose WAV, MP3, M4A, OGG, FLAC or WebM</p>
                    <input type="file" id="fileInput" accept=".wav,.mp3,.webm,.m4a,.ogg,.flac,.mp4,audio/*" class="hidden">
                </label>
                <button id="uploadBtn" class="px-10 bg-violet-600 hover:bg-violet-700 rounded-2xl font-semibold transition-all">Analyze</button>
            </div>
        </div>

        <!-- Results -->
        <div id="resultArea" class="hidden glass border border-white/10 rounded-3xl p-8">
            <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
                <i class="fa-solid fa-chart-bar"></i> Analysis Result
            </h2>
            <div id="results" class="space-y-6"></div>
        </div>
    </div>

    <script>
        // Backend URL. Override without editing code: index.html?api=http://host:port
        const API_BASE = new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:8000';
        const MAX_UPLOAD_MB = 10;            // keep in sync with EMOVOICE_MAX_UPLOAD_MB
        const MIN_RECORDING_MS = 500;
        // First format this browser can record. Safari records MP4, not WebM.
        const RECORDING_FORMATS = [
            { mimeType: 'audio/webm;codecs=opus', ext: 'webm' },
            { mimeType: 'audio/webm', ext: 'webm' },
            { mimeType: 'audio/mp4', ext: 'mp4' },
            { mimeType: 'audio/ogg;codecs=opus', ext: 'ogg' },
        ];
        const recordingFormat = window.MediaRecorder
            ? RECORDING_FORMATS.find(f => MediaRecorder.isTypeSupported(f.mimeType))
            : undefined;

        let mediaRecorder;
        let audioChunks = [];
        let recordingStartedAt = 0;
        let buttonHeld = false;   // true while the user is pressing the record button
        let isBusy = false;       // true while a request is in flight

        const recordBtn = document.getElementById('recordBtn');
        const recordText = document.getElementById('recordText');
        const liveIndicator = document.getElementById('liveIndicator');
        const fileInput = document.getElementById('fileInput');
        const fileLabel = document.getElementById('fileLabel');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultArea = document.getElementById('resultArea');
        const resultsDiv = document.getElementById('results');
        const status = document.getElementById('status');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function startRecording() {
            if (isBusy || (mediaRecorder && mediaRecorder.state === "recording")) return;
            if (!navigator.mediaDevices || !window.MediaRecorder) {
                alert("Recording needs a modern browser on http://localhost or https. Try uploading a file instead.");
                return;
            }
            buttonHeld = true;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true }
                });

                // The permission prompt / mic startup is async: if the button was
                // released meanwhile, don't start a recording that nothing will stop.
                if (!buttonHeld) {
                    stream.getTracks().forEach(track => track.stop());
                    return;
                }

                mediaRecorder = recordingFormat
                    ? new MediaRecorder(stream, { mimeType: recordingFormat.mimeType })
                    : new MediaRecorder(stream);
                const ext = recordingFormat ? recordingFormat.ext : 'webm';
                audioChunks = [];

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    audioChunks = [];
                    stream.getTracks().forEach(track => track.stop());
                    resetUI();

                    if (Date.now() - recordingStartedAt < MIN_RECORDING_MS) {
                        alert("Recording too short. Hold the button while you speak.");
                        return;
                    }
                    processAudio(audioBlob, `live_recording.${ext}`);
                };

                mediaRecorder.start();
                recordingStartedAt = Date.now();
                recordBtn.classList.add('recording', 'scale-105', 'bg-red-700');
                recordText.textContent = "RELEASE TO STOP";
                liveIndicator.classList.remove('hidden');
                status.textContent = "Recording";
                status.classList.add('bg-red-500/20', 'text-red-400');
            } catch (err) {
                buttonHeld = false;
                alert(err && err.name === 'NotAllowedError'
                    ? "Microphone access was denied. Allow it in the browser's site settings."
                    : "Could not start recording: " + (err && err.message ? err.message : "microphone unavailable."));
            }
        }

        function stopRecording() {
            buttonHeld = false;
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
        }

        function showError(message) {
            resultsDiv.innerHTML = `<p class="text-red-400 text-center">${escapeHtml(message)}</p>`;
        }

        function resetUI() {
            recordBtn.classList.remove('recording', 'scale-105', 'bg-red-700');
            recordText.textContent = "HOLD TO RECORD";
            liveIndicator.classList.add('hidden');
            status.textContent = "Ready";
            status.classList.remove('bg-red-500/20', 'text-red-400');
        }

        async function processAudio(audioData, filename) {
            resultArea.classList.remove('hidden');
            resultsDiv.innerHTML = `
                <div class="flex justify-center py-12">
                    <div class="animate-spin w-10 h-10 border-4 border-violet-500 border-t-transparent rounded-full"></div>
                </div>
            `;

            const formData = new FormData();
            formData.append("file", audioData, filename);

            isBusy = true;
            uploadBtn.disabled = true;
            try {
                const res = await fetch(`${API_BASE}/analyze`, { method: "POST", body: formData });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    showError(data.detail || `Server error (${res.status})`);
                    return;
                }
                displayResults(data);
            } catch (err) {
                showError(`Cannot reach the backend at ${API_BASE}. Is the server running?`);
            } finally {
                isBusy = false;
                uploadBtn.disabled = false;
            }
        }

        const MODE_LABELS = {
            multimodal: 'Text + Voice',
            text_only: 'Text only (voice confidence low)',
            voice_only: 'Voice only (no speech recognized)',
            none: 'No usable signal'
        };

        const NO_TRANSCRIPT = {
            unavailable: 'Speech recognition service unavailable. Check your internet connection.',
            no_speech: 'No words recognized in this audio.'
        };

        function transcriptHtml(data) {
            if (data.transcript) return `<p class="text-lg">"${escapeHtml(data.transcript)}"</p>`;
            const note = NO_TRANSCRIPT[data.asr_status] || NO_TRANSCRIPT.no_speech;
            return `<p class="text-lg text-zinc-500 italic">${escapeHtml(note)}</p>`;
        }

        function distributionHtml(probabilities) {
            return Object.entries(probabilities || {})
                .sort((a, b) => b[1] - a[1])
                .map(([emotion, p]) => {
                    const pct = (p * 100).toFixed(0);
                    return `
                        <div class="flex items-center gap-3 text-sm">
                            <span class="w-20 capitalize text-zinc-400">${escapeHtml(emotion)}</span>
                            <div class="flex-1 h-1.5 bg-zinc-700 rounded-full overflow-hidden">
                                <div class="h-full bg-amber-500/80" style="width: ${pct}%"></div>
                            </div>
                            <span class="w-10 text-right text-zinc-400">${pct}%</span>
                        </div>`;
                }).join('');
        }

        function displayResults(data) {
            const textConf = (data.text_intent.confidence * 100).toFixed(0);
            const voiceConf = (data.voice_emotion.confidence * 100).toFixed(0);
            const mode = MODE_LABELS[data.fusion_mode] || '';
            const timing = data.processing_ms ? ` • ${(data.processing_ms / 1000).toFixed(2)}s` : '';

            resultsDiv.innerHTML = `
                <div class="bg-zinc-900/70 rounded-2xl p-6 border border-white/10">
                    <p class="text-zinc-400 text-sm mb-1">Transcript</p>
                    ${transcriptHtml(data)}
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-zinc-900/70 rounded-2xl p-6 border border-white/10">
                        <p class="text-violet-400 text-sm font-medium">TEXT INTENT</p>
                        <p class="text-4xl font-bold mt-2">${escapeHtml(data.text_intent.label)}</p>
                        <div class="mt-4 h-2 bg-zinc-700 rounded-full overflow-hidden">
                            <div class="h-full bg-violet-500 transition-all" style="width: ${textConf}%"></div>
                        </div>
                        <p class="text-right text-sm text-zinc-400 mt-1">${textConf}%</p>
                    </div>

                    <div class="bg-zinc-900/70 rounded-2xl p-6 border border-white/10">
                        <p class="text-amber-400 text-sm font-medium">VOICE EMOTION</p>
                        <p class="text-4xl font-bold mt-2 capitalize">${escapeHtml(data.voice_emotion.label)}</p>
                        <div class="mt-4 h-2 bg-zinc-700 rounded-full overflow-hidden">
                            <div class="h-full bg-amber-500 transition-all" style="width: ${voiceConf}%"></div>
                        </div>
                        <p class="text-right text-sm text-zinc-400 mt-1">${voiceConf}%</p>
                    </div>
                </div>

                <div class="bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-3xl p-8 text-center">
                    <p class="uppercase text-xs tracking-widest opacity-75">Fusion Decision</p>
                    <p class="text-2xl font-semibold mt-3">${escapeHtml(data.fusion_decision)}</p>
                    <p class="text-xs opacity-75 mt-3">${escapeHtml(mode + timing)}</p>
                </div>

                <details class="bg-zinc-900/70 rounded-2xl p-6 border border-white/10">
                    <summary class="cursor-pointer text-zinc-400 text-sm">Voice emotion breakdown</summary>
                    <div class="space-y-2 mt-4">${distributionHtml(data.voice_emotion.probabilities)}</div>
                </details>
            `;
        }

        // Event Listeners
        recordBtn.addEventListener('mousedown', startRecording);
        recordBtn.addEventListener('mouseup', stopRecording);
        recordBtn.addEventListener('mouseleave', stopRecording);
        recordBtn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
        recordBtn.addEventListener('touchend', e => { e.preventDefault(); stopRecording(); });
        // Keyboard: hold Space or Enter while the button has focus.
        const isRecordKey = e => e.key === ' ' || e.key === 'Enter';
        recordBtn.addEventListener('keydown', e => {
            if (!isRecordKey(e)) return;
            e.preventDefault();
            if (!e.repeat) startRecording();
        });
        recordBtn.addEventListener('keyup', e => { if (isRecordKey(e)) { e.preventDefault(); stopRecording(); } });
        recordBtn.addEventListener('blur', stopRecording);

        uploadBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) return alert("Please select a file");
            if (file.size > MAX_UPLOAD_MB * 1024 * 1024) return alert(`File too large (max ${MAX_UPLOAD_MB} MB).`);
            processAudio(file, file.name);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length === 0) return;
            fileLabel.textContent = fileInput.files[0].name;
            uploadBtn.click();
        });
    </script>
</body>
</html>
